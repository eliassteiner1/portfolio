---

<div class="about-me">
    <h1>projects</h1>

    <div class="project-grid">
        <!-- builds one card for every entry in _data/projects.yml -->
        {% for project in site.data.projects %}
        <!-- the item is only the "slot" in the grid. it keeps its place and size, so nothing jumps when the card inside it leaves to become the popup -->
        <div class="project-item">
            <!-- the card is the visible thing, and also what grows into the popup -->
            <div class="project-card">
                <img src="{{ '/assets/images/' | append: project.image | absolute_url }}" class="project-bgimg" alt="">
                <div class="project-dsc">{{ project.title }}</div>

                <!-- invisible button that covers the whole card. a real button (instead of onclick on a div) makes the card reachable with tab and enter -->
                <button class="project-open" onclick=openProject(event) aria-label="open {{ project.title }}"></button>

                <!-- everything below is only shown while the card is the popup -->
                <button class="project-close" onclick=closeProject() aria-label="close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
                <div class="project-detail">
                    <p>{{ project.text }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

<!-- darkens the page behind the popup, clicking it closes the popup (same idea as the sidebar backdrop) -->
<div onclick=closeProject() class="project-backdrop"></div>
